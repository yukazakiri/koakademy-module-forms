name: Notify registry of release

on:
    push:
        tags:
            - 'v*'

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger registry rebuild
              env:
                  REGISTRY_DISPATCH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
              run: |
                  if [ -z "$REGISTRY_DISPATCH_TOKEN" ]; then
                      echo "REGISTRY_DISPATCH_TOKEN is not set; skipping dispatch (the registry daily rebuild will pick this up)."
                      exit 0
                  fi
                  curl -L -X POST \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer $REGISTRY_DISPATCH_TOKEN" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      https://api.github.com/repos/yukazakiri/koakademy-modules/dispatches \
                      -d "{\"event_type\":\"module-released\",\"client_payload\":{\"repository\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_REF_NAME\"}}"
